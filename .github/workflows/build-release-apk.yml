name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (misal: 1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK (Kotlin / Jetpack Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version Name & Code
        id: versioning
        run: |
          PROP_FILE=""
          if [[ -f "android/version.properties" ]]; then
            PROP_FILE="android/version.properties"
          elif [[ -f "tap-money-info/android/version.properties" ]]; then
            PROP_FILE="tap-money-info/android/version.properties"
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION_NAME="${RAW_TAG#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
          elif [[ -n "$PROP_FILE" ]]; then
            VERSION_NAME=$(grep '^versionName=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          else
            VERSION_NAME="1.0.0"
          fi

          if [[ -n "$PROP_FILE" ]] && [[ "${{ github.ref_type }}" != "tag" ]] && [[ -z "${{ github.event.inputs.version }}" ]]; then
            VERSION_CODE=$(grep '^versionCode=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          else
            IFS='.' read -r -a PARTS <<< "$VERSION_NAME"
            MAJOR=${PARTS[0]:-1}
            MINOR=${PARTS[1]:-0}
            PATCH=${PARTS[2]:-0}
            VERSION_CODE=$(( (MAJOR * 10000) + (MINOR * 100) + PATCH ))
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"

      - name: Build Release APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
          elif [ -d "tap-money-info/android" ]; then
            cd tap-money-info/android
          else
            echo "Direktori android tidak ditemukan!"
            exit 1
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode=$VERSION_CODE --no-daemon

      - name: Prepare Keystore for Signing
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore dari Repository Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > release.keystore
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'tapmoney' }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            if [ -z "$KEY_PASS" ]; then
              KEY_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            fi
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 tidak ditemukan. Membuat keystore temporary untuk rilis..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias tapmoney \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "Gilang#12" \
              -keypass "Gilang#12" \
              -dname "CN=TapMoney, OU=Mobile Dev, O=Machfudin, L=Jakarta, ST=DKI Jakarta, C=ID"
            echo "KEY_ALIAS=tapmoney" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=Gilang#12" >> $GITHUB_ENV
            echo "KEY_PASSWORD=Gilang#12" >> $GITHUB_ENV
          fi

      - name: Align & Sign APK (V1 + V2 + V3)
        run: |
          UNSIGNED_APK=$(find . -type f -name "*release*.apk" ! -name "*aligned*" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Daftar semua file apk yang ada:"
            find . -type f -name "*.apk" || true
            echo "APK release tidak ditemukan di folder build output!"
            exit 1
          fi

          echo "APK Ditemukan: $UNSIGNED_APK"
          BUILD_TOOLS=$(find ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Menggunakan Android Build Tools: $BUILD_TOOLS"

          $BUILD_TOOLS/zipalign -f -v -p 4 "$UNSIGNED_APK" aligned.apk

          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "TapMoney-v${VERSION_NAME}.apk" \
            aligned.apk

          $BUILD_TOOLS/apksigner verify --verbose "TapMoney-v${VERSION_NAME}.apk"
          echo "APK Berhasil Ditandatangani: TapMoney-v${VERSION_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapMoney-v${{ env.VERSION_NAME }}
          path: TapMoney-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TapMoney-v${{ env.VERSION_NAME }}.apk
          tag_name: ${{ github.ref_name }}
          name: TapMoney v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
